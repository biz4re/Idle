name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'website/**'
      - 'src/renderer/src/**'
      - 'src/shared/interface-scale.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path override (e.g. / or /repo-name)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install shared browser dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: website
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ github.event.inputs.base_path || steps.pages.outputs.base_path || '/' }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
