<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#F4F3EF"/>
  <circle cx="950" cy="315" r="300" stroke="#55766B" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25"/>
  <circle cx="950" cy="315" r="180" stroke="#55766B" stroke-width="2" opacity="0.4"/>
  <circle cx="950" cy="315" r="80" stroke="#55766B" stroke-width="3" opacity="0.7"/>
  <circle cx="950" cy="315" r="12" fill="#55766B"/>
  
  <g transform="translate(100, 160)">
    <!-- Logo badge -->
    <rect width="48" height="48" rx="12" fill="#FFFFFF" stroke="#E2E0D8" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="11" stroke="#55766B" stroke-width="2.5"/>
    <circle cx="24" cy="13" r="2.5" fill="#55766B"/>
    <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="700" fill="#292B29" letter-spacing="-0.03em">Idle</text>
    
    <!-- Headline -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="64" font-weight="700" fill="#292B29" letter-spacing="-0.04em">The web, without</text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="64" font-weight="700" fill="#292B29" letter-spacing="-0.04em">the noise.</text>
    
    <!-- Subhead -->
